<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>linghun9178 的个人主页</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #58a6ff, #1f6feb);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(88, 166, 255, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            color: #ffffff;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill-tag {
            background-color: rgba(88, 166, 255, 0.1);
            color: var(--accent);
            border: 1px solid rgba(88, 166, 255, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .timeline-item {
            border-left: 2px solid #30363d;
            padding-left: 15px;
            position: relative;
            margin-bottom: 15px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -5px;
            top: 6px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent);
        }

        .timeline-year {
            font-weight: bold;
            color: #ffffff;
            font-size: 14px;
        }

        .timeline-desc {
            font-size: 14px;
            color: var(--text-muted);
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 40px;
            padding-bottom: 20px;
        }
        
        a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="avatar">L</div>
            <h1>linghun9178</h1>
            <div class="subtitle">夜深了，早点休息</div>
        </header>

        <div class="card">
            <h2>📖 关于我</h2>
            <p style="margin: 0; font-size: 14px;">正在学习前端与后端开发。尝试用 PHP + MySQL 跑通动态页面，记录学习路上的每一个脚印。</p>
        </div>

        <div class="card">
            <h2>🛠️ 技能标签</h2>
            <div class="skills">
                <span class="skill-tag">HTML</span>
                <span class="skill-tag">CSS</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">PHP</span>
                <span class="skill-tag">MySQL</span>
                <span class="skill-tag">Git</span>
            </div>
        </div>

        <div class="card">
            <h2>⏱️ 学习时间线</h2>
            
            <div class="timeline-item">
                <div class="timeline-year">2024 年</div>
                <div class="timeline-desc">开始学习前端基础，掌握 HTML、CSS 和 JavaScript。</div>
            </div>
            
            <div class="timeline-item">
                <div class="timeline-year">2025 年</div>
                <div class="timeline-desc">接触后端开发，学习 PHP 与数据库基础。</div>
            </div>
            
            <div class="timeline-item">
                <div class="timeline-year">2026 年</div>
                <div class="timeline-desc">正式上线个人主页，持续更新学习日志。</div>
            </div>
        </div>

        <footer>
            © 2026 linghun9178. Powered by GitHub Pages.
        </footer>
    </div>

</body>
</html>
